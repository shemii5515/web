<!DOCTYPE html>
<html>
<head>
    <title>Striped Table</title>

    <style>
        #StudentTable {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }

        #StudentTable th {
            padding-top: 20px;
            padding-bottom: 20px;
            text-align: left;
            background-color: #b22222;
            color: white;
            border: 1px solid grey;
        }

        #StudentTable td {
            padding: 8px;
            border: 1px solid grey;
        }

        #StudentTable tr:nth-child(odd){
            background-color:#f2f2f2;
        }

        #StudentTable tr:nth-child(odd):hover {
            background-color: burlywood;
        }
    </style>
</head>
